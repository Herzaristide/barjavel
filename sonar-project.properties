# Configuration SonarQube Cloud. organization + projectKey doivent correspondre
# à ce qui est affiché dans SonarCloud (Administration → Update Key). Chaque
# projet a sa propre clé, distincte de celle des autres dépôts.
sonar.organization=herzaristide
sonar.projectKey=Herzaristide_barjavel
sonar.projectName=barjavel
sonar.sourceEncoding=UTF-8

# Sources : le moteur (app/), le plugin Vite, le CLI, le service worker, la
# config d'exemple et les workflows. Le généré (dist/), les dépendances et les
# images ne sont pas analysés.
sonar.sources=app,vite,bin,assets/sw.js,docs.config.ts,.github
sonar.tests=tests

# Couverture produite par `npm run test:coverage` (vitest + v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
