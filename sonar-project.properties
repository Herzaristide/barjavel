# Configuration SonarQube Cloud. organization + projectKey doivent correspondre
# à ce qui est affiché dans SonarCloud (Administration → Update Key). Chaque
# projet a sa propre clé, distincte de celle des autres dépôts.
sonar.organization=herzaristide
sonar.projectKey=Herzaristide_barjavel
sonar.projectName=barjavel

# Projet TypeScript. On analyse les sources en excluant le généré / vendored /
# binaire :
#   - node_modules/ : dépendances
#   - dist/ : build Vite
#   - assets/ + public/ : images
#   - lockfile
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,dist/**,assets/**,public/**,**/package-lock.json
