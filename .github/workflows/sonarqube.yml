name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyse SonarQube
    runs-on: ubuntu-latest
    env:
      # SonarQube Cloud. Seul le jeton est secret ; il se configure dans
      # Settings → Secrets and variables → Actions → SONAR_TOKEN.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historique complet : détection du « new code » et blame.
          fetch-depth: 0

      # Tests + couverture : SonarQube lit coverage/lcov.info.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage

      - name: Scan SonarQube
        # Sauté proprement si le jeton n'est pas configuré (ex : PR de fork).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
