name: Semgrep (SAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # hebdomadaire (lundi 04:30 UTC), décalé de CodeQL
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # publie le SARIF dans Security → Code scanning
  actions: read

jobs:
  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest
    # Image officielle : semgrep est préinstallé.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan
        run: >-
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/secrets
          --config p/security-audit
          --exclude node_modules
          --exclude dist
          --sarif --output semgrep.sarif

      - name: Publier les résultats
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
