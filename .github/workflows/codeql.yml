name: CodeQL (SAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # analyse hebdomadaire (lundi 04:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # nécessaire pour publier les résultats dans Security

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Le moteur et les artefacts de build ne sont pas du code source à auditer.
          config: |
            paths-ignore:
              - node_modules
              - dist
              - "**/*.min.js"

      - name: Analyser
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          category: "/language:${{ matrix.language }}"
